<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 - 简易版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #eee;
    gap: 14px;
    padding: 16px;
  }
  h1 { font-size: 22px; letter-spacing: 4px; color: #4ecca3; }
  .info {
    display: flex;
    gap: 24px;
    font-size: 15px;
  }
  .info span b { color: #4ecca3; font-size: 18px; }
  canvas {
    background: #16213e;
    border: 2px solid #4ecca3;
    border-radius: 8px;
    box-shadow: 0 0 24px rgba(78, 204, 163, 0.25);
    touch-action: none; /* 阻止移动端滑动页面，用于触屏控制 */
  }
  .controls { font-size: 13px; color: #aaa; text-align: center; line-height: 1.8; }
  .controls kbd {
    background: #333a56;
    border: 1px solid #4ecca3;
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 12px;
    color: #4ecca3;
  }
  button {
    margin-top: 6px;
    padding: 8px 28px;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    background: #4ecca3;
    color: #1a1a2e;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #6fe0ba; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(22, 33, 62, 0.85);
    color: #eee;
    border-radius: 8px;
    font-size: 20px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay .sub { font-size: 14px; color: #aaa; }
  .wrap { position: relative; }
</style>
</head>
<body>

<h1>🐍 贪吃蛇</h1>
<div class="info">
  <span>得分 <b id="score">0</b></span>
  <span>最高分 <b id="best">0</b></span>
</div>

<div class="wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div id="overlay" class="overlay">
    <div>按方向键开始游戏</div>
    <div class="sub">撞墙或撞到自己则游戏结束</div>
    <button id="restartBtn">重新开始</button>
  </div>
</div>

<div class="controls">
  <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向<br>
  手机：在屏幕上滑动即可控制
</div>

<script>
(function () {
  "use strict";

  // ========== 基本配置 ==========
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var restartBtn = document.getElementById("restartBtn");

  var GRID = 20;        // 网格数 20x20
  var CELL = canvas.width / GRID;
  var TICK_MS = 150;    // 每步间隔毫秒（速度）

  // ========== 游戏状态 ==========
  var snake;      // 蛇身坐标数组 [{x, y}, ...]，头在前
  var food;       // 食物坐标 {x, y}
  var dir;        // 当前方向
  var nextDir;    // 缓冲方向（避免一帧内多次转向导致撞自己）
  var score;
  var best = Number(localStorage.getItem("snakeBest") || 0);
  var running;    // 是否正在运行
  var over;       // 是否已结束
  var timer;

  bestEl.textContent = best;

  // ========== 工具函数 ==========
  function randomFood() {
    var free = [];
    // 找出所有空格子，随机选一个，保证食物不会刷在蛇身上
    for (var x = 0; x < GRID; x++) {
      for (var y = 0; y < GRID; y++) {
        var occupied = snake.some(function (s) { return s.x === x && s.y === y; });
        if (!occupied) free.push({ x: x, y: y });
      }
    }
    if (free.length === 0) return null; // 蛇占满全屏，胜利
    return free[Math.floor(Math.random() * free.length)];
  }

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };   // 初始向右
    nextDir = dir;
    score = 0;
    running = false;
    over = false;
    scoreEl.textContent = 0;
    food = randomFood();
    if (!food) { win(); return; }
    overlay.classList.remove("hidden");
    overlay.querySelector("div").textContent = "按方向键开始游戏";
    restartBtn.style.display = "inline-block";
    draw();
  }

  // ========== 游戏逻辑 ==========
  function step() {
    dir = nextDir;
    var head = snake[0];
    var nx = head.x + dir.x;
    var ny = head.y + dir.y;

    // 撞墙检测
    if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) { gameOver(); return; }

    var ate = (nx === food.x && ny === food.y);
    var newHead = { x: nx, y: ny };

    // 撞自己检测（如果没吃到食物，尾巴会移动，所以不用检查尾巴那格）
    var bodyToCheck = ate ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(function (s) { return s.x === nx && s.y === ny; })) { gameOver(); return; }

    snake.unshift(newHead);
    if (ate) {
      score++;
      scoreEl.textContent = score;
      food = randomFood();
      if (!food) { win(); return; }
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    over = true;
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem("snakeBest", best);
      bestEl.textContent = best;
    }
    overlay.querySelector("div").textContent = "游戏结束！得分 " + score;
    overlay.querySelector(".sub").textContent = "最高分 " + best;
    overlay.classList.remove("hidden");
  }

  function win() {
    over = true;
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem("snakeBest", best);
      bestEl.textContent = best;
    }
    overlay.querySelector("div").textContent = "🎉 你赢了！满分通关！";
    overlay.classList.remove("hidden");
  }

  function start() {
    if (over) reset();
    if (running) return;
    running = true;
    overlay.classList.add("hidden");
    clearInterval(timer);
    timer = setInterval(step, TICK_MS);
  }

  // ========== 绘制 ==========
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 网格线
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;
    for (var i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // 食物
    if (food) {
      ctx.fillStyle = "#e94560";
      roundRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 4);
    }

    // 蛇身
    for (var j = snake.length - 1; j >= 0; j--) {
      var s = snake[j];
      ctx.fillStyle = j === 0 ? "#4ecca3" : "#2d9c7f";
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 4);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // ========== 方向控制 ==========
  function setDir(nx, ny) {
    // 不允许直接反向（180 度掉头）
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
    if (!running && !over) start();
  }

  document.addEventListener("keydown", function (e) {
    var key = e.key.toLowerCase();
    var map = {
      arrowup: [0, -1], w: [0, -1],
      arrowdown: [0, 1], s: [0, 1],
      arrowleft: [-1, 0], a: [-1, 0],
      arrowright: [1, 0], d: [1, 0]
    };
    if (map[key]) {
      e.preventDefault(); // 防止方向键滚动页面
      setDir(map[key][0], map[key][1]);
    }
  });

  // 移动端：触摸滑动
  var touchStart = null;
  canvas.addEventListener("touchstart", function (e) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener("touchend", function (e) {
    if (!touchStart) return;
    var dx = e.changedTouches[0].clientX - touchStart.x;
    var dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return; // 太短忽略
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  // 重新开始按钮
  restartBtn.addEventListener("click", function () {
    reset();
    start();
  });

  // ========== 初始化 ==========
  reset();

  // 预览模式：首页缩略图截图使用（?preview），自动开始几步后暂停，不影响正常游玩
  if (location.search.indexOf("preview") !== -1) {
    setTimeout(function () {
      start();
      setTimeout(function () { clearInterval(timer); running = false; }, 900);
    }, 350);
  }
})();
</script>
</body>
</html>
